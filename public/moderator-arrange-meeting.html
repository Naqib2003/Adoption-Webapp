<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EvergreenBonds — Arrange Meeting</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>
  <div class="page-content">
    <div class="card" style="max-width:600px;">
      <h1>Arrange Meeting</h1>
      <p class="subtitle" id="contextLine">Loading...</p>

      <div id="pickerSection" style="display:none;">
        <label>Adoptee Case</label>
        <select id="caseSelect"></select>

        <label>Lawyer</label>
        <select id="lawyerSelect"></select>
      </div>

      <form id="meetingForm">
        <label>Meeting Date</label>
        <input type="date" id="meeting_date">

        <label>Meeting Time</label>
        <input type="time" id="meeting_time">

        <label>Notes</label>
        <input type="text" id="notes">

        <button type="submit">Confirm Meeting</button>
      </form>

      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="/js/moderator-nav.js"></script>
  <script src="/js/moderator-guard.js"></script>
  <script src="/js/moderator-arrange-meeting.js"></script>
</body>
</html>
