<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EvergreenBonds — Donate</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>
  <div class="page-content">
    <div class="card" style="max-width:600px;">
      <h1 id="pageName">Loading...</h1>
      <div id="details"></div>

      <form id="donateForm" style="margin-top:20px;">
        <label>Amount</label>
        <div style="display:flex; gap:8px; margin-bottom:10px;">
          <button type="button" class="amountBtn" data-amount="500" style="width:auto; background:#3c4a43;">৳500</button>
          <button type="button" class="amountBtn" data-amount="1000" style="width:auto; background:#3c4a43;">৳1000</button>
          <button type="button" class="amountBtn" data-amount="2500" style="width:auto; background:#3c4a43;">৳2500</button>
        </div>
        <input type="number" id="amount" placeholder="Or enter a custom amount" min="1">

        <div id="guestFields" style="display:none;">
          <label>Your Name</label>
          <input type="text" id="guest_name">
          <label>Your Email</label>
          <input type="email" id="guest_email">
          <label>Your Phone (optional)</label>
          <input type="text" id="guest_phone">
        </div>

        <p class="subtitle" id="donatingAsLine" style="display:none;"></p>

        <button type="submit">Donate</button>
      </form>

      <div id="message" class="message"></div>
      <div class="links"><a href="/donate.html">&larr; Back to Donate</a></div>
    </div>
  </div>
  <script src="/js/donate-nav.js"></script>
  <script src="/js/donate-money-detail.js"></script>
</body>
</html>
