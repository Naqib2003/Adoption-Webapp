<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EvergreenBonds — Fulfill a Need</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="siteHeader"></header>
  <div class="page-content">
    <div class="card" style="max-width:600px;">
      <h1 id="pageName">Loading...</h1>
      <div id="details"></div>

      <form id="fulfillForm" style="margin-top:20px;">
        <div id="guestFields" style="display:none;">
          <label>Your Name</label>
          <input type="text" id="guest_name">
          <label>Your Email</label>
          <input type="email" id="guest_email">
          <label>Your Phone (optional)</label>
          <input type="text" id="guest_phone">
        </div>

        <p class="subtitle" id="donatingAsLine" style="display:none;"></p>

        <button type="submit">I'll Provide This</button>
      </form>

      <div id="message" class="message"></div>
      <div class="links"><a href="/donate.html">&larr; Back to Donate</a></div>
    </div>
  </div>
  <script src="/js/donate-nav.js"></script>
  <script src="/js/donate-wishlist-detail.js"></script>
</body>
</html>
